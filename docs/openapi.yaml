openapi: 3.0.3
info:
  title: FoodApp recipe API
  version: 1.0.0
  description: Recipes, tags and ingredients with token authentication.
paths:
  /api/recipe/ingredient/:
    get:
      operationId: recipe_ingredient_list
      description: manage ingredients in the database
      parameters:
      - in: query
        name: assigned_only
        schema:
          type: integer
          enum:
          - 0
          - 1
        description: Filter by items assigned to recipes
      tags:
      - Ingredients
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
          description: ''
    post:
      operationId: recipe_ingredient_create
      description: manage ingredients in the database
      tags:
      - Ingredients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IngredientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IngredientRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
          description: ''
  /api/recipe/ingredient/{id}/:
    put:
      operationId: recipe_ingredient_update
      description: manage ingredients in the database
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ingredient.
        required: true
      tags:
      - Ingredients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IngredientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IngredientRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
          description: ''
    patch:
      operationId: recipe_ingredient_partial_update
      description: manage ingredients in the database
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ingredient.
        required: true
      tags:
      - Ingredients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedIngredientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedIngredientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedIngredientRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
          description: ''
    delete:
      operationId: recipe_ingredient_destroy
      description: manage ingredients in the database
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ingredient.
        required: true
      tags:
      - Ingredients
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/recipe/recipes/:
    get:
      operationId: recipe_recipes_list
      description: View for Managing Recipe APIs
      parameters:
      - in: query
        name: ingredients
        schema:
          type: string
        description: Comma separated list of Ingredient IDs to filter
      - in: query
        name: tags
        schema:
          type: string
        description: Comma separated list of Tag IDs to filter
      tags:
      - recipe
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recipe'
          description: ''
    post:
      operationId: recipe_recipes_create
      description: View for Managing Recipe APIs
      tags:
      - recipe
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecipeDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecipeDetailRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
          description: ''
  /api/recipe/recipes/{id}/:
    get:
      operationId: recipe_recipes_retrieve
      description: View for Managing Recipe APIs
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this recipe.
        required: true
      tags:
      - recipe
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
          description: ''
    put:
      operationId: recipe_recipes_update
      description: View for Managing Recipe APIs
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this recipe.
        required: true
      tags:
      - recipe
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecipeDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecipeDetailRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
          description: ''
    patch:
      operationId: recipe_recipes_partial_update
      description: View for Managing Recipe APIs
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this recipe.
        required: true
      tags:
      - recipe
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRecipeDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRecipeDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRecipeDetailRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDetail'
          description: ''
    delete:
      operationId: recipe_recipes_destroy
      description: View for Managing Recipe APIs
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this recipe.
        required: true
      tags:
      - recipe
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/recipe/recipes/{id}/upload-image/:
    post:
      operationId: recipe_recipes_upload_image_create
      description: upload an image to recipe
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this recipe.
        required: true
      tags:
      - recipe
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeImageRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecipeImageRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecipeImageRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeImage'
          description: ''
  /api/recipe/tags/:
    get:
      operationId: recipe_tags_list
      description: view for managing Tag APIs
      parameters:
      - in: query
        name: assigned_only
        schema:
          type: integer
          enum:
          - 0
          - 1
        description: Filter by items assigned to recipes
      tags:
      - Tags
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
          description: ''
    post:
      operationId: recipe_tags_create
      description: view for managing Tag APIs
      tags:
      - Tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TagRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TagRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: ''
  /api/recipe/tags/{id}/:
    put:
      operationId: recipe_tags_update
      description: view for managing Tag APIs
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this tag.
        required: true
      tags:
      - Tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TagRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TagRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: ''
    patch:
      operationId: recipe_tags_partial_update
      description: view for managing Tag APIs
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this tag.
        required: true
      tags:
      - Tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTagRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTagRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTagRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: ''
    delete:
      operationId: recipe_tags_destroy
      description: view for managing Tag APIs
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this tag.
        required: true
      tags:
      - Tags
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/user/create/:
    post:
      operationId: user_create_create
      description: Create a new user in the system
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/user/me/:
    get:
      operationId: user_me_retrieve
      description: manage authenticated user
      tags:
      - Users
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: user_me_update
      description: manage authenticated user
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: user_me_partial_update
      description: manage authenticated user
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/user/token/:
    post:
      operationId: user_token_create
      description: create a new auth token for user
      tags:
      - Users
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
          description: ''
components:
  schemas:
    AuthToken:
      type: object
      description: serializer for the user auth token
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    AuthTokenRequest:
      type: object
      description: serializer for the user auth token
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    Ingredient:
      type: object
      description: serializer for ingredients
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        recipe_count:
          type: integer
          readOnly: true
      required:
      - id
      - name
      - recipe_count
    IngredientRequest:
      type: object
      description: serializer for ingredients
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - name
    PatchedIngredientRequest:
      type: object
      description: serializer for ingredients
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    PatchedRecipeDetailRequest:
      type: object
      description: serializer for recipe detail view
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        time_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        link:
          type: string
          maxLength: 255
        tags:
          type: array
          items:
            $ref: '#/components/schemas/RecipeTagRequest'
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredientRequest'
        description:
          type: string
        image:
          type: string
          format: binary
          nullable: true
    PatchedTagRequest:
      type: object
      description: serializer for tags
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
    PatchedUserRequest:
      type: object
      description: Serializer for the user object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
        password:
          type: string
          writeOnly: true
          minLength: 5
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 255
    Recipe:
      type: object
      description: serializer for Recipes
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        time_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        link:
          type: string
          maxLength: 255
        tags:
          type: array
          items:
            $ref: '#/components/schemas/RecipeTag'
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredient'
      required:
      - id
      - price
      - time_minutes
      - title
    RecipeDetail:
      type: object
      description: serializer for recipe detail view
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        time_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        link:
          type: string
          maxLength: 255
        tags:
          type: array
          items:
            $ref: '#/components/schemas/RecipeTag'
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredient'
        description:
          type: string
        image:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - price
      - time_minutes
      - title
    RecipeDetailRequest:
      type: object
      description: serializer for recipe detail view
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        time_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        link:
          type: string
          maxLength: 255
        tags:
          type: array
          items:
            $ref: '#/components/schemas/RecipeTagRequest'
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredientRequest'
        description:
          type: string
        image:
          type: string
          format: binary
          nullable: true
      required:
      - price
      - time_minutes
      - title
    RecipeImage:
      type: object
      description: serializer for uploading an iamge to recipe
      properties:
        id:
          type: integer
          readOnly: true
        image:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - image
    RecipeImageRequest:
      type: object
      description: serializer for uploading an iamge to recipe
      properties:
        image:
          type: string
          format: binary
          nullable: true
      required:
      - image
    RecipeIngredient:
      type: object
      description: compact ingredient shown inside a recipe
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
      required:
      - id
      - name
    RecipeIngredientRequest:
      type: object
      description: compact ingredient shown inside a recipe
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - name
    RecipeTag:
      type: object
      description: compact tag shown inside a recipe
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
      required:
      - id
      - name
    RecipeTagRequest:
      type: object
      description: compact tag shown inside a recipe
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - name
    Tag:
      type: object
      description: serializer for tags
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        recipe_count:
          type: integer
          readOnly: true
      required:
      - id
      - name
      - recipe_count
    TagRequest:
      type: object
      description: serializer for tags
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - name
    User:
      type: object
      description: Serializer for the user object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        name:
          type: string
          maxLength: 255
      required:
      - email
      - name
    UserRequest:
      type: object
      description: Serializer for the user object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
        password:
          type: string
          writeOnly: true
          minLength: 5
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - email
      - name
      - password
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
